<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fenway Group | NQLs &amp; Partnerships</title>
<link rel="icon" type="image/png" href="assets/fenway-logo-icon.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="app-header">
  <img src="assets/fenway-logo-full.png" data-logo="full" alt="Fenway Group" class="app-logo" />
  <nav class="app-nav">
    <a href="index.html">Board</a>
    <a href="calendar.html">Calendar</a>
    <a href="otheritems.html">One Time BD Action Items</a>
    <a href="recurringtasks.html">Recurring BD Tasks</a>
    <a href="contacts.html">Contacts</a>
    <a href="nqls.html" class="active">NQLs &amp; Partnerships</a>
    <a href="config.html">Configuration</a>
  </nav>
  <div class="header-actions">
    <button id="newContactBtn" class="btn btn-primary">+ New</button>
  </div>
</header>

<main class="other-items-page">
  <h1>NQLs &amp; Partnerships</h1>
  <p class="calendar-subhead">Non-Qualified Leads and Partnerships you're tracking, and when they're next due for outreach.</p>

  <div class="filter-bar">
    <div class="filter-field filter-search">
      <label for="ctFilterSearch">Search</label>
      <input id="ctFilterSearch" type="text" placeholder="Search by name, company, or note&hellip;" />
    </div>
    <div class="filter-field">
      <label for="ctFilterOwner">Owner</label>
      <select id="ctFilterOwner"><option value="">All owners</option></select>
    </div>
    <div class="filter-field">
      <label for="ctFilterPartner">Client Partner</label>
      <select id="ctFilterPartner"><option value="">All partners</option></select>
    </div>
    <div class="filter-field">
      <label>Next outreach due</label>
      <div class="filter-date-range">
        <input id="ctFilterDateFrom" type="date" aria-label="Due from" />
        <span>&ndash;</span>
        <input id="ctFilterDateTo" type="date" aria-label="Due to" />
      </div>
    </div>
    <button type="button" id="ctFilterClear" class="btn-text">Clear filters</button>
  </div>

  <div id="contactsList">
    <!-- rendered by nqls.js -->
  </div>
</main>

<!-- New NQL / Partnership modal -->
<div id="newContactModal" class="modal-overlay hidden">
  <div class="modal modal-small">
    <div class="modal-header">
      <h2>New NQL or Partnership</h2>
      <button class="modal-close" data-close="newContactModal">&times;</button>
    </div>
    <form id="newContactForm">
      <div class="modal-body">
        <div class="field-row">
          <div class="field">
            <label for="ctName">Name *</label>
            <input id="ctName" name="name" required />
          </div>
          <div class="field">
            <label for="ctType">Type</label>
            <select id="ctType" name="contactType">
              <option value="Partnership" selected>Partnership</option>
              <option value="Non-Qualified Lead">Non-Qualified Lead</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="ctNextOutreach">Next outreach date *</label>
            <input id="ctNextOutreach" name="nextOutreachDate" type="date" required />
          </div>
          <div class="field">
            <label for="ctOwner">Owner</label>
            <select id="ctOwner" name="contactOwner">
              <!-- populated by nqls.js from config.contactOwners -->
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="ctCompany">Company name</label>
            <input id="ctCompany" name="companyName" placeholder="Optional" />
          </div>
          <div class="field">
            <label for="ctClientPartner">Client Partner</label>
            <select id="ctClientPartner" name="clientPartner">
              <!-- populated by nqls.js from config.clientPartners -->
            </select>
          </div>
        </div>
        <div class="field">
          <label for="ctNextOutreachAction">Next outreach action</label>
          <input id="ctNextOutreachAction" name="nextOutreachAction" placeholder="Briefly, what's the next outreach about?" />
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close="newContactModal">Cancel</button>
        <button type="submit" class="btn btn-primary">Add</button>
      </div>
    </form>
  </div>
</div>

<script src="api-client.js"></script>
<script src="demoData.js"></script>
<script src="nqls.js"></script>
</body>
</html>
